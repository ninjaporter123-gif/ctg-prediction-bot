name: CTG Automated VIP Session

on:
  schedule:
    # 2:00 PM UTC = 7:30 PM IST (Daily)
    - cron: '0 14 * * *'
    # 2:30 PM UTC = 8:00 PM IST (Daily)
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests cloudscraper

      - name: Execute Prediction Session
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py
        
