name: CTG Automated VIP Session

on:
  workflow_dispatch:
    inputs:
      target_wins:
        description: 'Target Wins Goal'
        required: false
        default: '10'

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Prediction Session
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py ${{ github.event.inputs.target_wins || '10' }}
        
